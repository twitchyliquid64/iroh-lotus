# The system user filerd runs as, and its membership of the lotus group, which
# is what lets it reach lotusd's control socket. Install to
# /usr/lib/sysusers.d/filerd.conf beside lotusd.conf and apply with
# `systemd-sysusers`.
u lotus-filer - "iroh-lotus filer" /var/lib/lotus-filer
m lotus-filer lotus
