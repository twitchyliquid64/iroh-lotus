[workspace]
members = [
    "crates/lotusctl",
    "crates/lotusd",
    "crates/lotusd-rpc",
    "crates/render",
    "crates/state",
    "crates/storage",
    "crates/wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.95" # MSRV
version = "0.0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.dependencies]
blake3 = { version = "1", features = ["serde"] }
cbor2 = { version = "1.1", features = ["std", "alloc", "derive", "futures", "tokio"] }
chrono = {version = "0.4", features = ["serde", "std"]}
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = { version = "4.6" }
dirs = "6"
# ZIP 215 verification: see "Signature verification" in AGENTS.md.
ed25519-zebra = "4"
generational-arena = "0.2"

nutype = { version = "0.7", features = ["serde"] }
rand = "0.10"
# `bundled` pins the SQLite version instead of trusting whatever the host ships.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1.24", features = ["v4", "v7", "serde"] }

# Our crates
lotusd = { path = "crates/lotusd" }
lotusd-rpc = { path = "crates/lotusd-rpc" }
render = { path = "crates/render" }
state = { path = "crates/state" }
storage = { path = "crates/storage" }
wire = { path = "crates/wire" }
