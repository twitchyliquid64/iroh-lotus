[package]
name = "lotusctl"
version.workspace = true
rust-version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Our crates
lotusd-rpc.workspace = true
render = { workspace = true, features = ["clap"] }
wire.workspace = true

# The end-to-end tests drive this CLI against a real daemon.
[dev-dependencies]
chrono.workspace = true
# In-memory iroh transport, so status can be read off a node with peers.
iroh = { workspace = true, features = ["test-utils", "unstable-custom-transports"] }
lotusd.workspace = true
state.workspace = true
tempfile.workspace = true
