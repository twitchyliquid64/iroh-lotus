name: CI
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    # Runners are ephemeral, so incremental state is never reused: it only
    # costs disk. And full DWARF in every test binary — each links iroh's
    # whole tree — is most of what a test build writes; line tables keep
    # backtraces readable at a fraction of the size.
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# main is excluded so a push to main never gets cancelled mid-flight.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Detect non-docs changes
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
              with:
                  filters: |
                      code:
                        - "**"
                        - ".github/**"
                        - "!*.md"
                        - "!**/*.md"
                        - "!docs/**"
                        - "!LICENSE"

    fmt:
        needs: [changes]
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Run rustfmt
              run: cargo fmt --all -- --check

    clippy:
        needs: [changes]
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Run Clippy
              run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    test:
        needs: [changes]
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            # A debug build of all 35 test binaries has run the runner out of
            # disk. Toolchains this job never touches are the cheapest space
            # to take back.
            - name: Free disk space
              run: |
                  set -euo pipefail
                  df -h / | tail -1
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h / | tail -1
            - name: Run tests
              run: cargo test --workspace --all-features --locked
