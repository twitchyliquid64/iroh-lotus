name: Release
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing v* tag to build and release"
                required: true

env:
    CARGO_TERM_COLOR: always

# One release run per tag, and never cancel one mid-flight: a cancelled run can
# leave a release with only some of its binaries attached.
concurrency:
    group: release-${{ github.event.inputs.tag || github.ref }}
    cancel-in-progress: false

# Checkout needs `contents: read` to clone a *private* repo: the token is what
# authorizes the fetch, and an unauthorized private repo answers 404, not 403.
# The release job widens this to write; nothing else gets a writable token.
permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      target: x86_64-unknown-linux-musl
                      runner: ubuntu-24.04
                    - arch: arm64
                      target: aarch64-unknown-linux-musl
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  ref: ${{ github.event.inputs.tag || github.ref }}
                  # The version crate derives its version from `git describe`
                  # against v* tags, so the build needs the full tag history.
                  fetch-depth: 0

            # musl is built natively on each runner (never cross-compiled), so
            # musl-tools' `musl-gcc` compiles the C deps (bundled SQLite, ring)
            # while rustc links musl's libc.a self-contained. Static binaries
            # drop the glibc floor entirely.
            - name: Install musl toolchain
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends musl-tools
                  musl-gcc --version
                  rustup target add ${{ matrix.target }}

            - name: Build lotusd and lotusctl
              env:
                  # cc-rs guesses a prefixed cross-compiler for musl targets and
                  # never checks it exists: aarch64 resolves to the hardcoded
                  # `aarch64-linux-musl-gcc`, which musl-tools does not ship (it
                  # ships a native `musl-gcc`). Name the compiler outright rather
                  # than relying on that guess on either arch.
                  CC_x86_64_unknown_linux_musl: musl-gcc
                  CC_aarch64_unknown_linux_musl: musl-gcc
              run: cargo build --release --locked --target ${{ matrix.target }} -p lotusd -p lotusctl

            - name: Verify the binaries report the tag
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  cd target/${{ matrix.target }}/release
                  for bin in lotusd lotusctl; do
                      reported=$(./"$bin" -V | awk '{print $2}')
                      if [ "$reported" != "${TAG#v}" ]; then
                          echo "::error::$bin reports $reported, expected ${TAG#v}"
                          exit 1
                      fi
                  done

            - name: Package
              id: package
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  name="iroh-lotus-${TAG}-linux-${{ matrix.arch }}"
                  mkdir -p "dist/$name"
                  cp target/${{ matrix.target }}/release/lotusd \
                     target/${{ matrix.target }}/release/lotusctl \
                     LICENSE README.md "dist/$name/"
                  tar -czf "dist/$name.tar.gz" -C dist "$name"
                  (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: |
                      dist/*.tar.gz
                      dist/*.tar.gz.sha256
                  if-no-files-found: error
                  retention-days: 7

    release:
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  ref: ${{ github.event.inputs.tag || github.ref }}
                  fetch-depth: 0

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: dist
                  merge-multiple: true

            - name: Collect checksums
              run: |
                  set -euo pipefail
                  cd dist
                  cat ./*.tar.gz.sha256 > SHA256SUMS
                  rm ./*.tar.gz.sha256
                  ls -l

            # A tag carrying a pre-release identifier (v1.2.3-rc1) is published
            # as a GitHub pre-release, matching how the version crate orders it.
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  prerelease=""
                  case "$TAG" in *-*) prerelease="--prerelease";; esac
                  gh release create "$TAG" \
                      --title "$TAG" \
                      --generate-notes \
                      $prerelease \
                      dist/*
